<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Google Chrome</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 主网格：预览与设置分栏，右列至少 360px -->
  <div id="root">
    <!-- 左侧：截图预览区（跨两行，黑色背景 DockPanel 等价） -->
    <div id="previewArea">
      <div id="previewInner">
        <img id="screenshot" src="assets/preview.png" alt="" />
        <!-- Looting 重影文字（白层 + 红层错位） -->
        <div id="lootingOverlay" class="hidden">
          <div class="loot-text loot-white">拾取中...</div>
          <div class="loot-text loot-red">拾取中...</div>
        </div>
      </div>
      <!-- 飞鱼动画层（ZIndex 100） -->
      <div id="fishLayer"></div>
    </div>

    <!-- 右上：工具按钮卡 -->
    <div class="card" id="toolbarCard">
      <button id="btnPlay" class="tool-btn" title="开始后请在 60 秒内切回游戏窗口，等待期间可停止">
        <img id="playImg" src="assets/play.png" alt="Start" />
        <img id="playImgDisabled" src="assets/play_disabled.png" alt="" class="hidden" />
      </button>
      <button id="btnStop" class="tool-btn" title="停止" disabled>
        <img id="stopImg" src="assets/stop.png" alt="Stop" class="hidden" />
        <img id="stopImgDisabled" src="assets/stop_disabled.png" alt="" />
      </button>
      <button id="btnSettings" class="tool-btn" title="颜色设置">
        <img src="assets/settings.png" alt="Settings" />
      </button>
      <button id="btnCastKey" class="tool-btn" title="抛竿按键 - 点击修改">
        <img src="assets/Button.png" alt="" class="castkey-bg" />
        <input id="castKeyInput" maxlength="1" value="4" autocomplete="off" />
      </button>
      <!-- 拟人化节奏开关（扩展功能，持久化到 settings.json，下次启动生效） -->
      <label id="humanizeLabel" title="下次启动生效：随机反应延迟、抛竿停顿、周期休息、宏键抖动和鼠标移动">
        <input type="checkbox" id="humanizeToggle" checked />
        <span>拟人化</span>
      </label>
      <p id="startupStatus" role="status" aria-live="polite" hidden></p>
      <fieldset id="macroPanel" disabled>
        <legend>周期宏（下次启动生效）</legend>
        <div class="macro-row">
          <div class="macro-key"><label>宏键 1 <input id="macroKey1" type="text" readonly placeholder="点击后按键" aria-label="宏键 1，点击后按键" /></label><button id="clearMacroKey1" type="button">清空</button></div>
          <div class="macro-key"><label>宏键 2 <input id="macroKey2" type="text" readonly placeholder="点击后按键" aria-label="宏键 2，点击后按键" /></label><button id="clearMacroKey2" type="button">清空</button></div>
        </div>
        <div class="macro-row">
          <label>每 <input id="macroMinutes" type="number" min="1" max="10080" step="1" value="10" /> 分钟执行</label>
          <button id="saveMacro" type="button">保存宏设置</button>
          <span id="macroSaveStatus" role="status"></span>
        </div>
        <p>启动时先执行一次；拟人化开启时附加 0～90 秒延迟。两键清空可禁用宏。</p>
      </fieldset>
      <div id="schedulePanel" title="定时动作在本次启动后计时">
        <label>定时 <input id="scheduleMinutes" type="number" min="0" max="10080" step="1" value="0" /> 分钟</label>
        <select id="scheduleAction">
          <option value="stop_fishing">停止钓鱼</option>
          <option value="close_wow">关闭魔兽世界</option>
          <option value="shutdown">关闭电脑</option>
        </select>
        <button id="saveSchedule" type="button">保存</button>
      </div>
      <div id="runtimeStatus" role="status" aria-live="polite">状态：空闲</div>
      <details id="diagnosticsPanel">
        <summary>设置恢复与诊断</summary>
        <p id="recoveryWarning" role="alert"></p>
        <p>导入或恢复前请先停止钓鱼。原配置会自动备份。</p>
        <div class="settings-actions">
          <button id="exportSettings" type="button">导出设置</button>
          <button id="importSettings" type="button">导入设置</button>
          <button id="resetSettings" type="button">恢复默认值</button>
          <button id="exportDiagnostics" type="button">导出诊断</button>
          <input id="settingsFile" type="file" accept=".json,application/json" hidden />
        </div>
        <p id="settingsResult" role="status"></p>
        <pre id="diagnosticsText"></pre>
      </details>
    </div>

    <!-- 右下：图表 Flipper + 日志 Flipper -->
    <div id="cardGrid">
      <!-- Flipper 1：振幅图表 -->
      <div class="flipper" id="graphFlipper">
        <div class="flipper-inner">
          <div class="flipper-face flipper-front card">
            <button class="flipper-header" data-flip="graphFlipper">
              <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/></svg>
              <span>浮漂振幅图表</span>
            </button>
            <canvas id="chartCanvas"></canvas>
          </div>
          <div class="flipper-face flipper-back card">
            <button class="show-btn" data-flip="graphFlipper">显示图表</button>
          </div>
        </div>
      </div>

      <!-- Flipper 2：日志 -->
      <div class="flipper" id="logFlipper">
        <div class="flipper-inner">
          <div class="flipper-face flipper-front card">
            <button class="flipper-header" data-flip="logFlipper">
              <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/></svg>
              <span>日志</span>
            </button>
            <div id="logList"></div>
          </div>
          <div class="flipper-face flipper-back card">
            <button class="show-btn" data-flip="logFlipper">显示日志</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="chart.js"></script>
  <script src="anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
