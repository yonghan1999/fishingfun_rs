[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform-windows",
    "crates/console",
    "crates/gui",
    "crates/input-source",
]

[workspace.package]
edition = "2021"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/julianperrott/FishingFun"

[workspace.dependencies]
fishing-core = { path = "crates/core" }
fishing-platform-windows = { path = "crates/platform-windows" }

image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# 微软官方 Win32 绑定，仅 platform-windows 使用
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

[profile.release]
lto = true
codegen-units = 1
# 剥离符号表，减少函数名等元数据残留（对字符串字面量无效，见 .cargo/config.toml）。
strip = "symbols"
debug = false
# 不设置 panic = "abort"：GUI 依赖 catch_unwind 隔离 bot 工作线程的 panic，
# abort 会让该保护失效并使整个进程直接终止。
